project:
  id: default

scan:
  max_file_size_mb: 10
  use_gitignore: false
  ignore_defaults: false
  include: []
  exclude:
    - __pycache__/
    - .pytest_cache/
    - .idea/
    - .git
    - .github
    - .gitignore
    - ./.pypirc
    - ./dist/
    - *.egg-info/
    - .reql/
    - .cache/
    - .tmp/
    - .tmp-tests/
    - *.json
    - LICENSE
    - AGENTS.md
    - .tmp-tests/


compile:
  ingest_documents: true
  documents:
    markdown: false
    plain_text: false
    restructured_text: false
    html: false
    log: false
    pdf: false
    json: false
    toml: false
    yaml: false
    ini: false
    csv: false
    tsv: false
    xml: false
    jsond: false

cache:
  enabled: true
  fingerprint_strategy: sha256

analysis:
  enable_hubs: true
  enable_communities: true

reporting:
  output_dir: reports

diagnostics:
  enabled: false
  path: ""
