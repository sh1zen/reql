name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to test and publish (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.release_ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH, for example v0.1.0. Got '$RELEASE_REF'."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: |
          mkdir -p .tmp
          PYTHONPATH=src python -m unittest discover -s tests -v

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-24.04
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
