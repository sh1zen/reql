name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/.tmp/coverage/.coverage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m coverage run -m unittest discover -s tests -v

      - name: Report coverage
        if: always()
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
          python -m coverage json
          python -m coverage html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .tmp/coverage/
          include-hidden-files: true
          retention-days: 30

      - name: Verify CLI entry points
        run: |
          python cli.py --help
          reql config show
          reql install codex --dry-run

  package-check:
    name: Package check
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine uv
          python -m build
          python -m twine check dist/*

      - name: Verify wheel outside the checkout
        run: |
          python -m venv .tmp/wheel-env
          .tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd .tmp
          wheel-env/bin/python -c "from reql import MemoryGraph; from mcp.server import main"
          wheel-env/bin/reql --help
          wheel-env/bin/reql config show
          wheel-env/bin/reql install codex --dry-run

      - name: Verify isolated uv tool install
        env:
          UV_TOOL_DIR: ${{ github.workspace }}/.tmp/uv-tools
          UV_TOOL_BIN_DIR: ${{ github.workspace }}/.tmp/uv-bin
        run: |
          uv tool install --from dist/*.whl reql
          cd .tmp
          uv-bin/reql --help
          uv-bin/reql install codex --dry-run

  reql-self-check:
    name: REQL self graph
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile repository graph
        run: python cli.py project compile

      - name: Generate reports
        run: python cli.py project report --output reports

      - name: Generate HTML and JSON graph export
        run: python cli.py export --html --json --out reql-graph-out

      - name: Upload graph artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reql-self-graph
          path: |
            .reql/memory.reql
            reports/*.md
            reql-graph-out/graph.html
            reql-graph-out/graph.json
          retention-days: 7

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install bandit pip-audit

      - name: bandit static security analysis
        continue-on-error: true
        run: bandit -r src cli.py launcher.py -ll

      - name: pip-audit dependency vulnerabilities
        continue-on-error: true
        run: pip-audit --strict
