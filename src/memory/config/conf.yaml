project:
  id: default

scan:
  max_file_size_mb: 10
  use_gitignore: false
  ignore_defaults: false
  include: []
  exclude:
    - ".git/"
    - ".reql/"
    - ".cache/"
    - ".venv/"
    - "venv/"
    - "node_modules/"
    - "dist/"
    - "build/"
    - "__pycache__/"
    - ".mypy_cache/"
    - ".pytest_cache/"
    - ".ruff_cache/"
    - ".DS_Store"
    - "*.pyc"
    - "*.sqlite"
    - "*.sqlite-journal"
    - "*.sqlite-shm"
    - "*.sqlite-wal"
    - "*.sqlite3"
    - "*.sqlite3-journal"
    - "*.sqlite3-shm"
    - "*.sqlite3-wal"
    - "*.db"
    - "*.db-journal"
    - "*.db-shm"
    - "*.db-wal"

compile:
  ingest_documents: true
  documents:
    markdown: false
    plain_text: false
    restructured_text: false
    html: false
    log: false
    pdf: false
    json: false
    toml: false
    yaml: false
    ini: false
    csv: false
    tsv: false
    xml: false
    jsond: false
  document_formats:
    markdown: {"extensions": [".md", ".markdown"]}
    plain_text: {"extensions": [".txt"], "filenames": ["LICENSE", "NOTICE"]}
    restructured_text: {"extensions": [".rst"]}
    html: {"extensions": [".html", ".htm"]}
    log: {"extensions": [".log"]}
    pdf: {"extensions": [".pdf"]}
    json: {"extensions": [".json"]}
    toml: {"extensions": [".toml"]}
    yaml: {"extensions": [".yaml", ".yml"]}
    ini: {"extensions": [".ini", ".cfg", ".conf"]}
    csv: {"extensions": [".csv"]}
    tsv: {"extensions": [".tsv"]}
    xml: {"extensions": [".xml"]}
    jsond: {"extensions": [".jsond"]}

cache:
  enabled: true
  fingerprint_strategy: sha256

analysis:
  enable_hubs: true
  enable_communities: true

reporting:
  output_dir: reports

diagnostics:
  enabled: false
  path: ""
